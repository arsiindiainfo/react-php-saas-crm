server {
    listen 80;
    server_name demo.arsiindiainfo.com;

    # React SPA static build (deployed by GitHub Actions, not git-cloned —
    # frontend/dist is gitignored and built fresh in CI).
    root /var/www/demo.arsiindiainfo.com;
    index index.html;

    location /api/ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        # These paths are INSIDE the crm-backend container's filesystem
        # (set by backend/Dockerfile's WORKDIR), not this host's filesystem.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~ /\.(ht|git) {
        deny all;
    }
}
