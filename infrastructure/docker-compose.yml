# mysql is mapped to host port 3307 (not the default 3306) because this dev
# machine already has other local/dockerized MySQL instances on 3306 —
# backend/.env's database.default.port is set to match. If 3307 is also
# taken, remap the left-hand side here and update backend/.env to match.
name: arsi-react-php-saas-crm

services:
  mysql:
    image: mysql:8
    container_name: crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: arsi_react_php_saas_crm
    ports:
      - "3307:3306"
    volumes:
      - crm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    container_name: crm-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  crm-mysql-data:
